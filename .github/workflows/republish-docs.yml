# CLOSES THE PIPELINE GAP: a docs change in the sfemu repo reaches production on its own.
#
# THE GAP. src/content/docs/*.md is gitignored and fetched at BUILD time by
# scripts/sync-docs.mjs from the sfemu repo. So editing a doc over there produces no commit
# here, Vercel never rebuilds, and the fix sits unpublished indefinitely. It happened: the API
# reference gained four control endpoints and stayed stale on the live site until something
# unrelated pushed.
#
# THE MECHANISM. This pushes an empty commit on a schedule. Vercel builds on push, the build
# re-runs the sync, and production gets whatever sfemu currently has. No content check is
# possible from here — sfemu is private and this repo's GITHUB_TOKEN cannot read it — so the
# rebuild is unconditional by necessity, not by preference.
#
# THE FAST PATH. sfemu/.github/workflows/publish-docs.yml fires a Vercel deploy hook the moment
# a doc changes, publishing in seconds. THIS WORKFLOW IS THE BACKSTOP AND STAYS EITHER WAY: a
# fast path that can be silently unset or revoked is not a guarantee, and the whole point here
# is that docs cannot go stale unnoticed. Its bound is hours (see the schedule below), which is
# a poor guarantee and a perfectly good safety net.
name: republish docs

on:
  schedule:
    # Requested every 30 minutes. GITHUB DOES NOT HONOUR THAT, and the schedule is the
    # backstop rather than the guarantee, so it does not need to. Measured on this repo:
    # runs landed at 08:28, 13:07 and 17:03 — roughly every four hours, at arbitrary
    # minutes, with most ticks dropped rather than merely delayed. That is documented
    # behaviour for scheduled workflows on low-activity repositories.
    #
    # So the real bound this path provides is HOURS, not minutes. Asking for 30 minutes
    # costs nothing and occasionally gets us one sooner; believing it would be the error.
    # Seconds-level publication comes from the deploy hook in sfemu, not from here.
    - cron: '9,39 * * * *'
  workflow_dispatch:

# One at a time. Two concurrent republishes would race on the same branch and one would fail on
# a stale ref — a red build that says nothing about the docs.
concurrency:
  group: republish-docs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Push an empty commit so Vercel rebuilds with current docs
        run: |
          git config user.name  "fidelic-bot"
          git config user.email "noreply@fidelic.dev"
          git commit --allow-empty -m "build: scheduled docs republish

          Rebuilds the site so scripts/sync-docs.mjs re-fetches the docs owned by the sfemu
          repo. Empty by design: nothing in this repo changed, and nothing should have."
          git push
